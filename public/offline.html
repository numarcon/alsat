<!doctype html>
<html lang="kk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#062c2b" />
    <title>Alsat — байланыс жоқ</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f7f4; color: #15362f; font-family: Inter, Arial, sans-serif; padding: 24px; }
      main { width: min(420px, 100%); background: #fff; border: 1px solid #e0ebe4; border-radius: 24px; padding: 36px 28px; text-align: center; box-shadow: 0 24px 70px #17372918; }
      .logo { width: 66px; height: 66px; margin: auto; display: grid; place-items: center; border-radius: 20px; background: #0b9346; color: #fff; font-size: 32px; font-weight: 900; }
      h1 { margin: 20px 0 8px; font-size: 22px; }
      p { margin: 0; color: #788b82; font-size: 14px; line-height: 1.55; }
      button { width: 100%; border: 0; border-radius: 12px; background: #0b9346; color: #fff; padding: 14px; margin-top: 24px; font: inherit; font-weight: 800; cursor: pointer; }
      small { display: block; margin-top: 18px; color: #9aa9a1; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">A</div>
      <h1>Интернет байланысы жоқ</h1>
      <p>Байланыс қалпына келгенде Alsat Workspace жұмысын жалғастырады.</p>
      <button type="button" onclick="location.reload()">Қайта қосылу</button>
      <small>ALSAT WORKSPACE</small>
    </main>
  </body>
</html>
